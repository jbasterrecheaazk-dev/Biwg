<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="stylesheet" href="css/styleTransactionPage.css">

<body>
  <header class="site-header">
    <a class="brand" href="firstPage.html" aria-label="Luma Inmobiliaria, inicio">
      <span class="brand-mark">L</span>
      <span class="brand-name">LUMA <small>INMOBILIARIA</small></span>
    </a>
    <nav class="main-nav" aria-label="Navegación principal">
      <a href="firstPage.html?catalogo">← Volver al catálogo</a>
    </nav>

  <main class="section-wrap transaction-main" id="transaction-container">
   
    <div class="admin-panel">

          <h2>Panel de Administración — Transacciones</h2>
        </div>
        <div id="admin-alert" class="alert-box hidden"></div>

                   <th>Id Propiedad</th>
                   <th>Estado</th>
                   <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
                 <!-- El contenido se renderiza dinámicamente según el flujo con JS -->
                <tr data-id="5">
                <td>#5</td><!--id-->
            <td>Fermin Calbeton</td><!--name--><!--surname-->
            <td>fermin@123</td><!--email-->
            <td>1</td><!--properties name  type-->
            <td> iniciada</td>
             <td>
                <button class="btn-delete">Delete</button>
            </td>  
            </tr>
            </tbody>
               </table>
           </div>
          </div>
  
  </main>

  <footer class="site-footer">
    <a class="brand brand-footer" href="firstPage.html">
      <span class="brand-mark">L</span>
      <span class="brand-name">LUMA <small>INMOBILIARIA</small></span>
